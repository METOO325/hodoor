<style>
:root{--bg:#EEF2F1;--surface:#fff;--ink:#1C2B33;--muted:#5E6F77;--line:#D3DCDA;--brand:#155E57;--brand-soft:#DCEBE8;--ok:#1E8E4E;--bad:#B03A2E;--warn:#A86A00;--r:10px;--rs:6px;font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:var(--brand);color:#fff}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap}
header.top h1{font-size:1.1rem;margin:0}
header.top .who{margin-inline-start:auto;display:flex;gap:10px;align-items:center;font-size:.9rem}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:var(--rs);padding:8px 16px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.light{background:transparent;border-color:rgba(255,255,255,.55);color:#fff;padding:4px 12px}
.btn.danger{background:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 10px;font-size:.85rem}

input,select,textarea{border:1px solid var(--line);border-radius:var(--rs);padding:9px 11px;background:#fff;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
main{padding:18px 0 48px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:1rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.login h2{margin:0 0 14px;font-size:1.2rem}
.login label{display:block;margin-bottom:12px;font-size:.9rem;color:var(--muted)}
.login input{width:100%;margin-top:4px}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em;margin:6px 0}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{background:#F4F7F6;position:sticky;top:0;color:var(--muted);font-weight:600}
.tablewrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:var(--rs);background:#fff}
.tag{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.8rem;background:var(--brand-soft);color:var(--brand)}
.tag.bad{background:#F8E1DE;color:var(--bad)}.tag.ok{background:#E1F2E8;color:var(--ok)}.tag.warn{background:#FBEFD6;color:var(--warn)}
.muted{color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 16px;cursor:pointer}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.toast{position:fixed;bottom:18px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:#1C2B33;color:#fff;padding:10px 18px;border-radius:8px;z-index:50}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

.cam video{width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;inset:18%;border:4px solid rgba(255,255,255,.85);border-radius:16px;pointer-events:none}
.flash{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:20px}

.flash .sub{font-size:clamp(1.1rem,4vw,1.8rem);margin-top:10px;opacity:.95}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:#fff;border-radius:var(--r);padding:18px;width:min(420px,100%)}
.modal label{display:block;margin-bottom:10px;font-size:.9rem;color:var(--muted)}
.modal input{width:100%;margin-top:4px;font-size:1.1rem}
.recent li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.recent{list-style:none;margin:0;padding:0}

<script>
const $ = (id) => document.getElementById(id);
const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const toLatin = (s) => String(s || '').replace(/[٠-٩]/g, (d) => AR_DIGITS.indexOf(d)).replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTime = (t) => new Date(t).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Africa/Cairo' });
const fmtDate = (t) => new Date(t).toLocaleDateString('ar-EG', { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'Africa/Cairo' });
const todayCairo = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Africa/Cairo' });
const LEVEL_NAME = { 1: 'المستوى الأول', 2: 'المستوى الثاني', 3: 'المستوى الثالث' };
function toast(msg) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2800); }
function exportXlsx(rows, headers, sheet, filename) {
  const data = [headers].concat(rows);
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = headers.map((h, i) => ({ wch: Math.min(40, Math.max(String(h).length + 2, ...rows.map((r) => String(r[i] == null ? '' : r[i]).length + 2))) }));

  XLSX.utils.book_append_sheet(wb, ws, sheet.slice(0, 30)); XLSX.writeFile(wb, filename);
}
/* تسجيل دخول الموظفين: Auth.init({roles:['admin'], title:'..', onReady(role, profile)}) */

<script>
/* ماسح QR بالكاميرا (jsQR). const sc = Scanner(videoEl, onCode); sc.start(); sc.stop(); sc.flip() */
function Scanner(video, onCode, opt) {
  opt = opt || {};
  let stream = null, raf = 0, running = false, facing = 'environment', last = '', lastAt = 0, tick = 0;
  const cv = document.createElement('canvas'); const cx = cv.getContext('2d', { willReadFrequently: true });
  async function start() {
    stop();
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    } catch (e) { if (opt.onError) opt.onError(e); return false; }
    video.srcObject = stream; video.setAttribute('playsinline', ''); await video.play().catch(() => {});
    running = true; loop(); return true;
  }
  function stop() {
    running = false; cancelAnimationFrame(raf);
    if (stream) stream.getTracks().forEach((t) => t.stop()); stream = null;
  }
  function loop() {
    if (!running) return;
    raf = requestAnimationFrame(loop);
    if ((tick++ % 3) !== 0) return;
    if (video.readyState < 2 || !video.videoWidth) return;
    const w = 640, h = Math.round(video.videoHeight * (w / video.videoWidth));
    cv.width = w; cv.height = h; cx.drawImage(video, 0, 0, w, h);
    const img = cx.getImageData(0, 0, w, h);
    const r = jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' });
    if (r && r.data) {
      const now = Date.now();
      if (r.data === last && now - lastAt < (opt.repeatMs || 4000)) return;
      last = r.data; lastAt = now; onCode(r.data.trim());
    }
  }
  return { start, stop, flip() { facing = facing === 'environment' ? 'user' : 'environment'; return start(); }, reset() { last = ''; } };
}
function beep(ok) {
  try {
    const A = window.AudioContext || window.webkitAudioContext; const c = new A(); const o = c.createOscillator(); const g = c.createGain();
    o.connect(g); g.connect(c.destination); o.type = 'sine'; o.frequency.value = ok ? 880 : 220; g.gain.value = 0.15;
    o.start(); o.stop(c.currentTime + (ok ? 0.12 : 0.35));
  } catch (e) {}
}

</script>
<script>
let sc, busy = false, flashT = 0;
function showFlash(kind, big, sub, tick) {
  const f = $('flash'); f.className = 'flash ' + kind;
  f.innerHTML = `<div class="tick">${tick}</div><div class="big">${esc(big)}</div><div class="sub">${esc(sub || '')}</div>`;
  clearTimeout(flashT); flashT = setTimeout(() => { f.classList.add('hidden'); busy = false; }, kind === 'ok' ? 1500 : 2200);
  f.onclick = () => { clearTimeout(flashT); f.classList.add('hidden'); busy = false; };
}
function handleResult(r) {
  if (!r) { beep(false); return showFlash('bad', 'حصل خطأ', 'جرّب تاني', '✕'); }
  if (!r.ok) { beep(false); return showFlash('bad', r.msg || 'غير مسموح', r.name || '', '✕'); }
  const grp = r.visitor ? 'زائر' : [r.level ? (LEVEL_NAME[r.level] || '') : '', r.track || ''].filter(Boolean).join(' — ');
  if (r.dup) { beep(true); return showFlash('dup', r.name, 'دخل بالفعل الساعة ' + fmtTime(r.at), '✓'); }
  beep(true); showFlash('ok', r.name, 'دخل ✓  ' + grp + '  ' + fmtTime(r.at), '✓'); loadRecent();
}
async function onCode(code) {
  if (busy) return; busy = true;
  const { data, error } = await sb.rpc('gate_scan', { p_token: code });
  handleResult(error ? null : data);
}
async function loadRecent() {
  const { data } = await sb.rpc('gate_recent', { p_limit: 25 });
  const d = data || []; $('cnt').textContent = d.length ? '(' + d.length + ')' : '';
  $('recent').innerHTML = d.map((e) => `<li><span><b>${esc(e.name)}</b> <span class="muted">${esc(e.kind === 'visitor' ? 'زائر' : (e.kind === 'nid' ? 'بالرقم القومي' : ''))}</span></span><span class="muted">${fmtTime(e.at)}</span></li>`).join('') || '<li class="muted">لسه محدش دخل</li>';
}
function modal(html, onSubmit) {
  const m = $('modal'); m.classList.remove('hidden'); busy = true;
  m.innerHTML = `<form class="box">${html}<div class="err" id="me"></div><div class="row"><button class="btn">تسجيل الدخول</button><button type="button" class="btn ghost" id="mx">إلغاء</button></div></form>`;
  const close = () => { m.classList.add('hidden'); m.innerHTML = ''; busy = false; };
  $('mx').onclick = close;
  m.querySelector('form').onsubmit = async (e) => { e.preventDefault(); const ok = await onSubmit(); if (ok) close(); };
  const first = m.querySelector('input'); if (first) first.focus();
}
$('bNid').onclick = () => modal('<h3>الدخول بالرقم القومي</h3><label>الرقم القومي للطالب (14 رقم)<input id="nid" inputmode="numeric" maxlength="20" required></label>', async () => {
  const n = toLatin($('nid').value).replace(/\D/g, '');
  if (n.length !== 14) { $('me').textContent = 'الرقم القومي لازم يكون 14 رقم'; return false; }
  const { data, error } = await sb.rpc('gate_by_nid', { p_nid: n }); $('modal').classList.add('hidden'); handleResult(error ? null : data); return true;
});
$('bVis').onclick = () => modal('<h3>دخول زائر</h3><label>اسم الزائر<input id="vn" required></label><label>الرقم القومي<input id="vi" inputmode="numeric" maxlength="20"></label><label>سبب الزيارة<input id="vp"></label>', async () => {
  const { data, error } = await sb.rpc('gate_visitor', { p_name: $('vn').value, p_nid: $('vi').value, p_purpose: $('vp').value });
  if (error || !data.ok) { $('me').textContent = (data && data.msg) || 'حصل خطأ'; return false; }
  $('modal').classList.add('hidden'); handleResult(data); return true;
});
$('bFlip').onclick = () => sc.flip();

// ماكينة الباركود (USB): بتكتب الكود وتدوس Enter. بنقرا بـ event.code عشان تشتغل حتى لو الكيبورد عربي
(function () {
  let buf = '', last = 0;
  document.addEventListener('keydown', (e) => {
    const t = e.target && e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    const now = Date.now();
    if (now - last > 400) buf = '';
    last = now;
    if (e.key === 'Enter') {
      const c = buf; buf = '';
      if (/^EGT-[A-Z0-9]{8}$/.test(c)) { e.preventDefault(); onCode(c); }
      return;
    }
    let ch = '';
    if (/^Key[A-Z]$/.test(e.code)) ch = e.code.slice(3);
    else if (/^Digit\d$/.test(e.code)) ch = e.code.slice(5);
    else if (/^Numpad\d$/.test(e.code)) ch = e.code.slice(6);
    else if (e.code === 'Minus' || e.code === 'NumpadSubtract') ch = '-';
    else if (e.key && e.key.length === 1 && /[A-Za-z0-9-]/.test(e.key)) ch = e.key.toUpperCase();
    if (ch) buf += ch;
  });
})();

Auth.init({ roles: ['security', 'admin'], title: 'بوابة المعهد', onReady: async () => {
  sc = Scanner($('v'), onCode, { onError: () => { $('camerr').textContent = 'مقدرتش أفتح الكاميرا. اسمح للمتصفح باستخدامها وافتح الصفحة من رابط https.'; } });
  sc.start(); loadRecent(); setInterval(loadRecent, 20000);
} });
</script>
