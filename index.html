:root{--bg:#EEF2F1;--surface:#fff;--ink:#1C2B33;--muted:#5E6F77;--line:#D3DCDA;--brand:#155E57;--brand-soft:#DCEBE8;--ok:#1E8E4E;--bad:#B03A2E;--warn:#A86A00;--r:10px;--rs:6px;font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:var(--brand);color:#fff}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap}
header.top h1{font-size:1.1rem;margin:0}
header.top .who{margin-inline-start:auto;display:flex;gap:10px;align-items:center;font-size:.9rem}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:var(--rs);padding:8px 16px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.light{background:transparent;border-color:rgba(255,255,255,.55);color:#fff;padding:4px 12px}
.btn.danger{background:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{border:1px solid var(--line);border-radius:var(--rs);padding:9px 11px;background:#fff;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
main{padding:18px 0 48px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:1rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.login h2{margin:0 0 14px;font-size:1.2rem}
.login label{display:block;margin-bottom:12px;font-size:.9rem;color:var(--muted)}
.login input{width:100%;margin-top:4px}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em;margin:6px 0}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{background:#F4F7F6;position:sticky;top:0;color:var(--muted);font-weight:600}
.tablewrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:var(--rs);background:#fff}
.tag{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.8rem;background:var(--brand-soft);color:var(--brand)}
.tag.bad{background:#F8E1DE;color:var(--bad)}.tag.ok{background:#E1F2E8;color:var(--ok)}.tag.warn{background:#FBEFD6;color:var(--warn)}
.muted{color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 16px;cursor:pointer}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.toast{position:fixed;bottom:18px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:#1C2B33;color:#fff;padding:10px 18px;border-radius:8px;z-index:50}

</style>

.cam{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:1;width:100%;margin:12px 0}
.cam video{width:100%;height:100%;object-fit:cover}

const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const toLatin = (s) => String(s || '').replace(/[٠-٩]/g, (d) => AR_DIGITS.indexOf(d)).replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));

const fmtTime = (t) => new Date(t).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Africa/Cairo' });
const fmtDate = (t) => new Date(t).toLocaleDateString('ar-EG', { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'Africa/Cairo' });
const todayCairo = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Africa/Cairo' });

function toast(msg) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2800); }

/* تسجيل دخول الموظفين: Auth.init({roles:['admin'], title:'..', onReady(role, profile)}) */

<script>
/* ماسح QR بالكاميرا (jsQR). const sc = Scanner(videoEl, onCode); sc.start(); sc.stop(); sc.flip() */
function Scanner(video, onCode, opt) {
  opt = opt || {};
  let stream = null, raf = 0, running = false, facing = 'environment', last = '', lastAt = 0, tick = 0;
  const cv = document.createElement('canvas'); const cx = cv.getContext('2d', { willReadFrequently: true });
  async function start() {
    stop();
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    } catch (e) { if (opt.onError) opt.onError(e); return false; }
    video.srcObject = stream; video.setAttribute('playsinline', ''); await video.play().catch(() => {});
    running = true; loop(); return true;
  }
  function stop() {
    running = false; cancelAnimationFrame(raf);
    if (stream) stream.getTracks().forEach((t) => t.stop()); stream = null;
  }
  function loop() {
    if (!running) return;
    raf = requestAnimationFrame(loop);
    if ((tick++ % 3) !== 0) return;
    if (video.readyState < 2 || !video.videoWidth) return;
    const w = 640, h = Math.round(video.videoHeight * (w / video.videoWidth));
    cv.width = w; cv.height = h; cx.drawImage(video, 0, 0, w, h);
    const img = cx.getImageData(0, 0, w, h);
    const r = jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' });
    if (r && r.data) {
      const now = Date.now();
      if (r.data === last && now - lastAt < (opt.repeatMs || 4000)) return;
      last = r.data; lastAt = now; onCode(r.data.trim());
    }
  }
  return { start, stop, flip() { facing = facing === 'environment' ? 'user' : 'environment'; return start(); }, reset() { last = ''; } };
}
function beep(ok) {
  try {
    const A = window.AudioContext || window.webkitAudioContext; const c = new A(); const o = c.createOscillator(); const g = c.createGain();
    o.connect(g); g.connect(c.destination); o.type = 'sine'; o.frequency.value = ok ? 880 : 220; g.gain.value = 0.15;
    o.start(); o.stop(c.currentTime + (ok ? 0.12 : 0.35));
  } catch (e) {}
}

</script>
<script>
const LS = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
function devKey() { let k = LS.get('hd_key'); if (!k) { const a = new Uint8Array(24); crypto.getRandomValues(a); k = Array.from(a, (b) => b.toString(16).padStart(2, '0')).join(''); LS.set('hd_key', k); } return k; }
const root = $('root'); let sc = null;
const params = new URLSearchParams(location.search);
let pendingX = params.get('x') || null;
function stopCam() { if (sc) { sc.stop(); sc = null; } }
function view(html) { stopCam(); root.innerHTML = html; }
function parseX(text) {
  try { const u = new URL(text); const x = u.searchParams.get('x'); if (x) return x; } catch (e) {}
  return /^[0-9a-f-]{36}\.[0-9a-f]{8}$/i.test(text) ? text : null;
}
function result(kind, tick, big, sub, extra) {
  view(`<div class="res ${kind}"><div class="tick">${tick}</div><div class="big">${esc(big)}</div><div class="sub">${esc(sub || '')}</div></div>${extra || ''}<button class="btn ghost big" id="again">رجوع</button>`);
  $('again').onclick = home;
}
async function submit(x) {
  const [sid, code] = x.split('.'); const token = LS.get('hd_token');
  view('<div class="card">بيتم تسجيل حضورك…</div>');
  const { data, error } = await sb.rpc('mark_attendance', { p_token: token, p_key: devKey(), p_session: sid, p_code: code });
  if (error || !data) return result('bad', '✕', 'حصل خطأ في الاتصال', 'اتأكد من النت وجرّب تاني');
  const n = data.name || '';
  if (data.ok && data.status === 'done') return result('ok', '✓', 'تم تسجيل حضورك', n + ' — ' + (data.course || ''));
  if (data.ok && data.status === 'dup') return result('warn', '✓', 'حضورك متسجل قبل كده', n + ' — ' + (data.course || ''));
  if (data.status === 'code') return result('bad', '✕', 'الكود انتهى', 'امسح الكود اللي على الشاشة تاني بسرعة');
  if (data.status === 'closed') return result('bad', '✕', 'المحاضرة اتقفلت', 'كلّم الدكتور');
  if (data.status === 'device') return result('bad', '✕', 'الجهاز ده مش مربوط بحسابك', 'اطلب من الإدارة اعتماد جهازك الجديد');
  return result('bad', '✕', 'الكارنيه مش معروف', 'اربط جهازك من جديد');
}
async function bind(token) {
  token = String(token || '').trim().toUpperCase();
  const { data, error } = await sb.rpc('bind_device', { p_token: token, p_key: devKey() });
  if (error || !data) return { ok: false, msg: 'حصل خطأ في الاتصال' };
  if (data.status === 'not_found') return { ok: false, msg: 'الكود ده مش موجود. اتأكد إنك بتمسح الباركود اللي على الكارنيه.' };
  if (data.status === 'pending') return { ok: false, pending: true, name: data.name };
  if (data.ok) { LS.set('hd_token', token); LS.set('hd_name', data.name); return { ok: true, name: data.name }; }
  return { ok: false, msg: 'مقدرتش أربط الجهاز' };
}
function setup(msg) {
  view(`<div class="card"><h2 style="margin-top:0">ربط جهازك بالكارنيه</h2><p class="muted">أول مرة بس: وجّه الكاميرا على الباركود اللي في ركن الكارنيه.</p><div class="cam"><video id="v" muted></video><div class="frame"></div></div><div class="err" id="e">${esc(msg || '')}</div><p class="muted" style="margin:6px 0">أو اكتب الكود المطبوع تحت الباركود:</p><div class="row"><input id="t" placeholder="EGT-XXXXXXXX" dir="ltr" style="flex:1;text-transform:uppercase"><button class="btn" id="go">ربط</button></div></div>`);
  const done = async (tk) => {
    $('e').textContent = 'جاري الربط…'; const r = await bind(tk);
    if (r.ok) return home();
    if (r.pending) return result('warn', '⏳', 'الجهاز ده جديد', (r.name || '') + ' — اتبعت طلب للإدارة لاعتماده، وبعدها هتقدر تسجل.');
    $('e').textContent = r.msg; if (sc) sc.reset();
  };
  sc = Scanner($('v'), (c) => { if (/^EGT-[A-Z0-9]{8}$/i.test(c)) done(c); }, { onError: () => { $('e').textContent = 'الكاميرا مش شغالة. اكتب الكود يدويًا.'; } });
  sc.start(); $('go').onclick = () => done($('t').value);
}
function home() {
  const token = LS.get('hd_token'); if (!token) return setup();
  if (pendingX) { const x = pendingX; pendingX = null; history.replaceState(null, '', location.pathname); return submit(x); }
  view(`<div class="card"><div style="font-size:3rem">👋</div><h2 style="margin:6px 0">${esc(LS.get('hd_name') || '')}</h2><p class="muted">لتسجيل الحضور: وجّه الكاميرا على الباركود اللي على شاشة الدكتور.</p></div><button class="btn big" id="scan">مسح باركود المحاضرة</button><button class="btn ghost big" id="unbind">ده مش حسابي / تغيير الكارنيه</button>`);
  $('scan').onclick = scanLecture;
  $('unbind').onclick = () => { if (confirm('هتمسح ربط الكارنيه من الجهاز ده. متأكد؟')) { LS.set('hd_token', ''); LS.set('hd_name', ''); home(); } };
}
function scanLecture() {
  view('<div class="card"><h3 style="margin-top:0">امسح الباركود على شاشة الدكتور</h3><div class="cam"><video id="v" muted></video><div class="frame"></div></div><div class="err" id="e"></div><button class="btn ghost big" id="back">رجوع</button></div>');
  sc = Scanner($('v'), (c) => { const x = parseX(c); if (x) submit(x); else { $('e').textContent = 'ده مش باركود محاضرة'; } }, { repeatMs: 1500, onError: () => { $('e').textContent = 'الكاميرا مش شغالة'; } });
  sc.start(); $('back').onclick = home;
}
home();
</script>
