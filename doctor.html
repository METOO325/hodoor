<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حضور المحاضرات</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F1;--surface:#fff;--ink:#1C2B33;--muted:#5E6F77;--line:#D3DCDA;--brand:#155E57;--brand-soft:#DCEBE8;--ok:#1E8E4E;--bad:#B03A2E;--warn:#A86A00;--r:10px;--rs:6px;font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:var(--brand);color:#fff}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap}
header.top h1{font-size:1.1rem;margin:0}
header.top .who{margin-inline-start:auto;display:flex;gap:10px;align-items:center;font-size:.9rem}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:var(--rs);padding:8px 16px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.light{background:transparent;border-color:rgba(255,255,255,.55);color:#fff;padding:4px 12px}
.btn.danger{background:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{border:1px solid var(--line);border-radius:var(--rs);padding:9px 11px;background:#fff;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
main{padding:18px 0 48px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:1rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.login h2{margin:0 0 14px;font-size:1.2rem}
.login label{display:block;margin-bottom:12px;font-size:.9rem;color:var(--muted)}
.login input{width:100%;margin-top:4px}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em;margin:6px 0}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{background:#F4F7F6;position:sticky;top:0;color:var(--muted);font-weight:600}
.tablewrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:var(--rs);background:#fff}
.tag{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.8rem;background:var(--brand-soft);color:var(--brand)}
.tag.bad{background:#F8E1DE;color:var(--bad)}.tag.ok{background:#E1F2E8;color:var(--ok)}.tag.warn{background:#FBEFD6;color:var(--warn)}
.muted{color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 16px;cursor:pointer}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.toast{position:fixed;bottom:18px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:#1C2B33;color:#fff;padding:10px 18px;border-radius:8px;z-index:50}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
.lec{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:8px}
.lec b{font-size:1.02rem}.lec .m{color:var(--muted);font-size:.88rem}
.live{display:grid;grid-template-columns:minmax(300px,1fr) minmax(300px,1fr);gap:16px}
@media(max-width:820px){.live{grid-template-columns:1fr}}
.qrbox{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:center}
#qr{display:inline-block;padding:14px;background:#fff;line-height:0}
#qr img,#qr canvas{max-width:min(78vw,520px);height:auto!important;width:min(78vw,520px)!important}
.bar{height:10px;background:var(--brand-soft);border-radius:99px;overflow:hidden;margin:10px auto 0;max-width:420px}
.bar i{display:block;height:100%;background:var(--brand);width:100%}
.count{font-size:2.6rem;font-weight:700;color:var(--brand);line-height:1}
.full .live{grid-template-columns:1fr}.full .side{display:none}.full header.top,.full #pickCard{display:none}
.full #qr img,.full #qr canvas{width:min(86vh,86vw)!important}
</style>
</head>
<body>
<div id="login"></div>
<div id="app" class="hidden">
<header class="top"><div class="wrap"><h1>حضور المحاضرات</h1><div class="who" id="who"></div></div></header>
<main><div class="wrap">
  <div id="pick">
    <div id="resume"></div>
    <div class="panel"><h3>اختار محاضرتك النهارده</h3>
      <div class="row" style="margin-bottom:10px"><label class="f" style="flex:1 1 220px">دوّر باسم الدكتور أو المادة<input id="q" placeholder="اكتب جزء من الاسم"></label></div>
      <div id="lecs" class="muted">بحمّل جدول النهارده…</div></div>
    <details class="panel"><summary style="cursor:pointer;font-weight:600">محاضرة مش في الجدول (إدخال يدوي)</summary>
      <div class="row" style="margin-top:10px">
        <label class="f" style="flex:1 1 220px">المادة<input id="mc"></label>
        <label class="f" style="flex:1 1 220px">الفرقة / الشعبة<select id="mg"></select></label>
        <label class="f" style="flex:1 1 140px">القاعة<input id="mr"></label>
        <button class="btn" id="mgo">ابدأ المحاضرة</button></div></details>
    <div class="panel"><h3>محاضراتي السابقة</h3><div id="past" class="muted">…</div></div>
  </div>
  <div id="liveView" class="hidden">
    <div class="panel" id="pickCard"><div class="row" style="justify-content:space-between"><div><b id="lt"></b><div class="muted" id="ls"></div></div>
      <div class="row"><button class="btn ghost" id="bFull">عرض ملء الشاشة (للبروجكتر)</button><button class="btn ghost" id="bXls">تصدير Excel</button><button class="btn danger" id="bEnd">إنهاء المحاضرة</button></div></div></div>
    <div class="live">
      <div class="qrbox"><div class="muted" style="margin-bottom:8px">الطلبة يمسحوا الباركود ده من تطبيق الحضور — بيتغير كل 10 ثواني</div><div id="qr"></div><div class="bar"><i id="barfill"></i></div>
        <div class="muted" style="margin-top:8px">الحاضرين: <span class="count" id="cnt" style="font-size:1.6rem">0</span></div></div>
      <div class="panel side"><div class="tabs"><button id="tp" class="on">حضروا</button><button id="ta">لسه</button></div><div class="tablewrap" style="max-height:60vh"><table><thead><tr><th>#</th><th>الاسم</th><th>الكود</th><th>الوقت</th></tr></thead><tbody id="rb"></tbody></table></div></div>
    </div>
  </div>
  <div id="pastView" class="hidden"></div>
</div></main>
</div>
<script>
window.CFG = {
  SUPABASE_URL: 'https://rvuhunrnnsaswjpgfxdi.supabase.co',
  SUPABASE_KEY: 'sb_publishable_mn0bgauaXwKS8Am00Yu9Ww_ugzf6_ge',
  JADWAL_URL: 'https://yojdekykcumpslarkfaf.supabase.co',
  JADWAL_KEY: 'sb_publishable_LsYAEhQ7GSQ8iODLKNmWKQ_agv5Vnv1'
};

</script>
<script>
const $ = (id) => document.getElementById(id);
const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const toLatin = (s) => String(s || '').replace(/[٠-٩]/g, (d) => AR_DIGITS.indexOf(d)).replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTime = (t) => new Date(t).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Africa/Cairo' });
const fmtDate = (t) => new Date(t).toLocaleDateString('ar-EG', { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'Africa/Cairo' });
const todayCairo = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Africa/Cairo' });
const LEVEL_NAME = { 1: 'المستوى الأول', 2: 'المستوى الثاني', 3: 'المستوى الثالث' };
function toast(msg) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2800); }
function exportXlsx(rows, headers, sheet, filename) {
  const data = [headers].concat(rows);
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = headers.map((h, i) => ({ wch: Math.min(40, Math.max(String(h).length + 2, ...rows.map((r) => String(r[i] == null ? '' : r[i]).length + 2))) }));
  const wb = XLSX.utils.book_new(); wb.Workbook = { Views: [{ RTL: true }] };
  XLSX.utils.book_append_sheet(wb, ws, sheet.slice(0, 30)); XLSX.writeFile(wb, filename);
}
/* تسجيل دخول الموظفين: Auth.init({roles:['admin'], title:'..', onReady(role, profile)}) */
const Auth = {
  async init(opt) {
    const root = $('login');
    const show = (msg) => {
      root.classList.remove('hidden'); $('app').classList.add('hidden');
      root.innerHTML = `<form class="login" id="lf"><h2>${esc(opt.title)}</h2><label>البريد الإلكتروني<input type="email" id="em" required autocomplete="username"></label><label>كلمة المرور<input type="password" id="pw" required autocomplete="current-password"></label><div class="err" id="le">${esc(msg || '')}</div><button class="btn" style="width:100%">دخول</button></form>`;
      $('lf').onsubmit = async (e) => {
        e.preventDefault(); $('le').textContent = '';
        const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
        if (error) { $('le').textContent = 'البريد أو كلمة المرور غير صحيحة'; return; }
        go();
      };
    };
    const go = async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return show();
      const { data: role, error } = await sb.rpc('my_role');
      if (error) return show('تعذر التحقق من الصلاحية');
      if (!opt.roles.includes(role)) {
        await sb.auth.signOut();
        return show(role === 'none' || !role ? 'حسابك لسه ملوش صلاحية. كلّم الإدارة.' : 'الحساب ده مالوش صلاحية على الصفحة دي.');
      }
      root.classList.add('hidden'); $('app').classList.remove('hidden');
      const u = session.user; const name = (u.user_metadata && (u.user_metadata.display_name || u.user_metadata.full_name)) || u.email;
      if ($('who')) $('who').innerHTML = `<span>${esc(name)}</span><button class="btn light" id="lo">خروج</button>`;
      if ($('lo')) $('lo').onclick = async () => { await sb.auth.signOut(); location.reload(); };
      opt.onReady(role, session.user);
    };
    go();
  }
};

</script>
<script>
const jd = window.supabase.createClient(CFG.JADWAL_URL, CFG.JADWAL_KEY, { auth: { persistSession: false } });
let cur = null, nextT = 0, nextAt = 0, barT = 0, rosT = 0, roster = [], tab = 'p', qrObj = null;
function groupInfo(s) {
  const t = (s.title || '') + ' ' + (s.track || '');
  let level = null; const m = { 'الأول': 1, 'الثاني': 2, 'الثالث': 3 };
  const lv = (s.title || '').match(/المستوى (\S+)/); if (lv && m[lv[1]]) level = m[lv[1]];
  const fr = (s.title || '').match(/الفرقة (\S+)/); if (fr) level = 10 + ({ 'الأولى': 1, 'الثانية': 2, 'الثالثة': 3, 'الرابعة': 4 }[fr[1]] || 0);
  let tk = 'any'; if (/إرشاد|ارشاد/.test(t)) tk = 'guide'; else if (/ضيافة/.test(t)) tk = 'hosp'; else if (/دراسات سياحية/.test(t)) tk = 'tour';
  return { level, tk, label: [s.title, s.track].filter(Boolean).join(' — ') };
}
async function loadToday() {
  const day = new Date(todayCairo() + 'T12:00').getDay(), today = todayCairo();
  const [{ data: sch, error: e1 }, { data: items, error: e2 }, { data: ch }] = await Promise.all([
    jd.from('schedules').select('*').order('sort'), jd.from('schedule_items').select('*').eq('day', day).order('start_time'),
    jd.from('schedule_changes').select('*').eq('on_date', today)]);
  window.__diag = (e1 || e2) ? 'خطأ في قراءة الجدول: ' + ((e1 || e2).message || '') : `اليوم ${['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][day]} ${today} — في الجدول ${(items || []).length} محاضرة لليوم ده من ${(sch || []).length} جدول`;
  const S = {}; (sch || []).forEach((s) => S[s.id] = s);
  const chBy = {}; (ch || []).forEach((c) => { if (c.item_id) chBy[c.item_id] = c; });
  let list = [];
  (items || []).forEach((it) => { const c = chBy[it.id]; if (c && c.cancelled) return; const o = Object.assign({}, it); if (c) ['subject', 'lecturer', 'room', 'start_time', 'end_time'].forEach((k) => { if (c[k]) o[k] = c[k]; }); list.push(o); });
  (ch || []).filter((c) => !c.item_id && !c.cancelled).forEach((c) => list.push({ schedule_id: c.schedule_id, subject: c.subject, lecturer: c.lecturer, room: c.room, start_time: c.start_time, end_time: c.end_time }));
  list.sort((a, b) => String(a.start_time).localeCompare(String(b.start_time)));
  window.__lecs = list.map((it) => ({ it, s: S[it.schedule_id] })).filter((x) => x.s);
  window.__sch = sch || [];
  renderLecs(); const sel = $('mg'); sel.innerHTML = window.__sch.map((s, i) => `<option value="${i}">${esc(groupInfo(s).label)}</option>`).join('');
}
function renderLecs() {
  const q = toLatin($('q').value).trim();
  const L = (window.__lecs || []).filter((x) => !q || (x.it.lecturer || '').includes(q) || (x.it.subject || '').includes(q));
  $('lecs').innerHTML = L.length ? L.map((x, i) => { const g = groupInfo(x.s); return `<div class="lec"><div><b>${esc(x.it.subject)}</b><div class="m">${esc(x.it.lecturer || '')} · ${esc(x.it.room || '')} · ${esc(g.label)}</div><div class="m">${String(x.it.start_time).slice(0, 5)} – ${String(x.it.end_time).slice(0, 5)}</div></div><button class="btn" data-i="${window.__lecs.indexOf(x)}">ابدأ</button></div>`; }).join('') : '<div class="muted">مفيش محاضرات مطابقة النهارده. استخدم الإدخال اليدوي تحت.<br><small>' + esc((q ? 'البحث شغّال بـ "' + q + '" — امسحه. ' : '') + (window.__diag || '')) + '</small></div>';
  $('lecs').querySelectorAll('button').forEach((b) => b.onclick = () => { const x = window.__lecs[+b.dataset.i]; const g = groupInfo(x.s); start(x.it.subject + (x.it.lecturer ? ' — ' + x.it.lecturer : ''), g.label, g.level, g.tk, x.it.room); });
}
$('q').oninput = renderLecs;
$('mgo').onclick = () => { const c = $('mc').value.trim(); if (!c) return toast('اكتب اسم المادة'); const s = window.__sch[+$('mg').value]; const g = groupInfo(s); start(c, g.label, g.level, g.tk, $('mr').value); };
async function start(course, label, level, tk, room) {
  const { data, error } = await sb.rpc('start_session', { p_course: course, p_group_title: label, p_level: level, p_track_key: tk, p_room: room || '' });
  if (error) return toast('حصل خطأ: ' + error.message);
  openLive({ id: data, course, group_title: label, room });
}
function openLive(s) {
  cur = s; $('pick').classList.add('hidden'); $('pastView').classList.add('hidden'); $('liveView').classList.remove('hidden');
  $('lt').textContent = s.course; $('ls').textContent = [s.group_title, s.room].filter(Boolean).join(' · ');
  tick(); refreshRoster(); clearInterval(rosT); rosT = setInterval(refreshRoster, 6000);
  clearInterval(barT); barT = setInterval(() => { const left = Math.max(0, nextAt - Date.now()); $('barfill').style.width = (left / 100) + '%'; }, 100);
}
async function tick() {
  clearTimeout(nextT); if (!cur) return;
  const { data, error } = await sb.rpc('current_code', { p_session: cur.id });
  if (error || !data) { nextT = setTimeout(tick, 2000); return; }
  if (!data.ok) { toast('المحاضرة اتقفلت'); return closeLive(); }
  const url = new URL('index.html', location.href); url.searchParams.set('x', cur.id + '.' + data.code);
  const box = $('qr'); box.innerHTML = ''; qrObj = new QRCode(box, { text: url.toString(), width: 520, height: 520, correctLevel: QRCode.CorrectLevel.M });
  $('cnt').textContent = data.count; const ms = Math.max(400, Math.round(data.left * 1000));
  nextAt = Date.now() + ms; nextT = setTimeout(tick, ms + 150);
}
async function refreshRoster() {
  if (!cur) return; const { data } = await sb.rpc('session_roster', { p_session: cur.id }); roster = data || []; drawRoster();
}
function drawRoster() {
  const P = roster.filter((r) => r.present), A = roster.filter((r) => !r.present);
  $('tp').textContent = 'حضروا (' + P.length + ')'; $('ta').textContent = 'لسه (' + A.length + ')'; $('cnt').textContent = P.length;
  const L = tab === 'p' ? P : A;
  $('rb').innerHTML = L.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.name)}${r.off_roster ? ' <span class="tag warn">خارج الشعبة</span>' : ''}</td><td>${esc(r.code)}</td><td>${r.at ? fmtTime(r.at) : ''}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">لا يوجد</td></tr>';
}
$('tp').onclick = () => { tab = 'p'; $('tp').classList.add('on'); $('ta').classList.remove('on'); drawRoster(); };
$('ta').onclick = () => { tab = 'a'; $('ta').classList.add('on'); $('tp').classList.remove('on'); drawRoster(); };
function xls(sess, rows) {
  const out = rows.map((r, i) => [i + 1, r.code, r.name, r.present ? 'حضر' : 'غائب', r.at ? fmtTime(r.at) : '', r.off_roster ? 'خارج الشعبة' : '']);
  exportXlsx(out, ['#', 'كود الطالب', 'الاسم', 'الحالة', 'وقت الحضور', 'ملاحظة'], 'الحضور', 'حضور-' + String(sess.course).slice(0, 30) + '-' + todayCairo() + '.xlsx');
}
$('bXls').onclick = async () => { await refreshRoster(); xls(cur, roster); };
$('bFull').onclick = () => { document.body.classList.toggle('full'); if (document.body.classList.contains('full') && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.body.classList.remove('full'); });
$('bEnd').onclick = async () => { if (!confirm('إنهاء المحاضرة؟ الباركود هيتقفل ومحدش هيقدر يسجل بعد كده.')) return; await refreshRoster(); const s = cur; await sb.rpc('end_session', { p_session: s.id }); xls(s, roster); closeLive(); };
function closeLive() { cur = null; clearTimeout(nextT); clearInterval(barT); clearInterval(rosT); document.body.classList.remove('full'); $('liveView').classList.add('hidden'); $('pick').classList.remove('hidden'); loadPast(); }
async function loadPast() {
  const { data } = await sb.rpc('my_sessions', { p_limit: 40 }); const d = data || [];
  const open = d.filter((s) => !s.ended_at);
  $('resume').innerHTML = open.map((s) => `<div class="panel" style="border-color:var(--brand)"><div class="row" style="justify-content:space-between;align-items:center"><div><b>محاضرة شغالة: ${esc(s.course)}</b><div class="muted">${fmtTime(s.started_at)} · حضر ${s.present}</div></div><button class="btn" data-id="${s.id}" data-c="${esc(s.course)}" data-g="${esc(s.group_title || '')}" data-r="${esc(s.room || '')}">كمّل</button></div></div>`).join('');
  $('resume').querySelectorAll('button').forEach((b) => b.onclick = () => openLive({ id: b.dataset.id, course: b.dataset.c, group_title: b.dataset.g, room: b.dataset.r }));
  $('past').innerHTML = d.filter((s) => s.ended_at).map((s) => `<div class="lec"><div><b>${esc(s.course)}</b><div class="m">${fmtDate(s.started_at)} ${fmtTime(s.started_at)} · ${esc(s.group_title || '')} · حضر ${s.present}</div></div><button class="btn ghost sm" data-id="${s.id}" data-c="${esc(s.course)}">تصدير Excel</button></div>`).join('') || '<span class="muted">لسه مفيش</span>';
  $('past').querySelectorAll('button').forEach((b) => b.onclick = async () => { const { data: r } = await sb.rpc('session_roster', { p_session: b.dataset.id }); xls({ course: b.dataset.c }, r || []); });
}
Auth.init({ roles: ['doctor', 'admin'], title: 'حضور المحاضرات', onReady: () => { loadToday(); loadPast(); } });
</script>
</body></html>
