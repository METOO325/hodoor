<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الحسابات — الرسوم</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F1;--surface:#fff;--ink:#1C2B33;--muted:#5E6F77;--line:#D3DCDA;--brand:#155E57;--brand-soft:#DCEBE8;--ok:#1E8E4E;--bad:#B03A2E;--warn:#A86A00;--r:10px;--rs:6px;font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:var(--brand);color:#fff}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap}
header.top h1{font-size:1.1rem;margin:0}
header.top .who{margin-inline-start:auto;display:flex;gap:10px;align-items:center;font-size:.9rem}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:var(--rs);padding:8px 16px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.light{background:transparent;border-color:rgba(255,255,255,.55);color:#fff;padding:4px 12px}
.btn.danger{background:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{border:1px solid var(--line);border-radius:var(--rs);padding:9px 11px;background:#fff;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
main{padding:18px 0 48px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:1rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.login h2{margin:0 0 14px;font-size:1.2rem}
.login label{display:block;margin-bottom:12px;font-size:.9rem;color:var(--muted)}
.login input{width:100%;margin-top:4px}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em;margin:6px 0}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{background:#F4F7F6;position:sticky;top:0;color:var(--muted);font-weight:600}
.tablewrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:var(--rs);background:#fff}
.tag{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.8rem;background:var(--brand-soft);color:var(--brand)}
.tag.bad{background:#F8E1DE;color:var(--bad)}.tag.ok{background:#E1F2E8;color:var(--ok)}.tag.warn{background:#FBEFD6;color:var(--warn)}
.muted{color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 16px;cursor:pointer}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.toast{position:fixed;bottom:18px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:#1C2B33;color:#fff;padding:10px 18px;border-radius:8px;z-index:50}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div id="login"></div>
<div id="app" class="hidden">
<header class="top"><div class="wrap"><h1>الحسابات — حالة سداد الرسوم</h1><div class="who" id="who"></div></div></header>
<main><div class="wrap">
  <div class="panel"><h3>الملخص <span class="muted" id="sum"></span></h3>
    <div class="row"><label class="btn" style="cursor:pointer">رفع كشف المدفوعين (Excel)<input type="file" id="up" accept=".xlsx,.xls,.csv" hidden></label><button class="btn ghost" id="xUn">تنزيل اللي لسه ما دفعوش</button><button class="btn ghost" id="xPd">تنزيل اللي دفعوا</button></div>
    <div class="muted" style="margin-top:8px">الكشف: أي ملف فيه أسماء (أو أكواد) الطلاب اللي دفعوا. لو فيه عمود "الحالة" بنقرأه، ولو مفيش بنعتبر كل اللي في الملف دفعوا. الأسماء اللي مش لاقيينها بنعرضها قبل الحفظ.</div></div>
  <div class="panel"><div class="row"><label class="f" style="flex:1 1 240px">بحث بالاسم أو الكود<input id="q"></label><label class="f">عرض<select id="flt"><option value="">الكل</option><option value="paid">دفعوا</option><option value="unpaid">لسه</option><option value="none">لسه ما اتحددش</option></select></label><span class="muted" id="cnt"></span></div></div>
  <div class="tablewrap"><table><thead><tr><th>الكود</th><th>الاسم</th><th>الفرقة</th><th>الشعبة</th><th>الرسوم</th></tr></thead><tbody id="tb"></tbody></table></div>
</div></main>
</div>
<div id="modal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px"></div>
<script>
window.CFG = {
  SUPABASE_URL: 'https://rvuhunrnnsaswjpgfxdi.supabase.co',
  SUPABASE_KEY: 'sb_publishable_mn0bgauaXwKS8Am00Yu9Ww_ugzf6_ge',
  JADWAL_URL: 'https://yojdekykcumpslarkfaf.supabase.co',
  JADWAL_KEY: 'sb_publishable_LsYAEhQ7GSQ8iODLKNmWKQ_agv5Vnv1'
};

</script>
<script>
const $ = (id) => document.getElementById(id);
const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const toLatin = (s) => String(s || '').replace(/[٠-٩]/g, (d) => AR_DIGITS.indexOf(d)).replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTime = (t) => new Date(t).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Africa/Cairo' });
const fmtDate = (t) => new Date(t).toLocaleDateString('ar-EG', { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'Africa/Cairo' });
const todayCairo = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Africa/Cairo' });
const LEVEL_NAME = { 1: 'المستوى الأول', 2: 'المستوى الثاني', 3: 'المستوى الثالث' };
function toast(msg) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2800); }
function exportXlsx(rows, headers, sheet, filename) {
  const data = [headers].concat(rows);
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = headers.map((h, i) => ({ wch: Math.min(40, Math.max(String(h).length + 2, ...rows.map((r) => String(r[i] == null ? '' : r[i]).length + 2))) }));
  const wb = XLSX.utils.book_new(); wb.Workbook = { Views: [{ RTL: true }] };
  XLSX.utils.book_append_sheet(wb, ws, sheet.slice(0, 30)); XLSX.writeFile(wb, filename);
}
/* تسجيل دخول الموظفين: Auth.init({roles:['admin'], title:'..', onReady(role, profile)}) */
const Auth = {
  async init(opt) {
    const root = $('login');
    const show = (msg) => {
      root.classList.remove('hidden'); $('app').classList.add('hidden');
      root.innerHTML = `<form class="login" id="lf"><h2>${esc(opt.title)}</h2><label>البريد الإلكتروني<input type="email" id="em" required autocomplete="username"></label><label>كلمة المرور<input type="password" id="pw" required autocomplete="current-password"></label><div class="err" id="le">${esc(msg || '')}</div><button class="btn" style="width:100%">دخول</button></form>`;
      $('lf').onsubmit = async (e) => {
        e.preventDefault(); $('le').textContent = '';
        const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
        if (error) { $('le').textContent = 'البريد أو كلمة المرور غير صحيحة'; return; }
        go();
      };
    };
    const go = async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return show();
      const { data: role, error } = await sb.rpc('my_role');
      if (error) return show('تعذر التحقق من الصلاحية');
      if (!opt.roles.includes(role)) {
        await sb.auth.signOut();
        return show(role === 'none' || !role ? 'حسابك لسه ملوش صلاحية. كلّم الإدارة.' : 'الحساب ده مالوش صلاحية على الصفحة دي.');
      }
      root.classList.add('hidden'); $('app').classList.remove('hidden');
      const u = session.user; const name = (u.user_metadata && (u.user_metadata.display_name || u.user_metadata.full_name)) || u.email;
      if ($('who')) $('who').innerHTML = `<span>${esc(name)}</span><button class="btn light" id="lo">خروج</button>`;
      if ($('lo')) $('lo').onclick = async () => { await sb.auth.signOut(); location.reload(); };
      opt.onReady(role, session.user);
    };
    go();
  }
};

</script>
<script>
let ALL = [];
const norm = (n) => String(n || '').replace(/[ً-ْـ]/g, '').replace(/\s+/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/ئ/g, 'ي').replace(/ؤ/g, 'و');
const grp = (l) => LEVEL_NAME[l] || ('مستوى ' + l);
async function load() {
  let out = [], off = 0;
  for (;;) { const { data, error } = await sb.rpc('fees_list', { p_offset: off, p_limit: 1000 }); if (error) { toast('حصل خطأ: ' + error.message); break; } out = out.concat(data || []); if (!data || data.length < 1000) break; off += 1000; }
  ALL = out; draw();
}
function draw() {
  const c = { paid: 0, unpaid: 0, none: 0 }; ALL.forEach((s) => c[s.fees_status || 'none']++);
  $('sum').textContent = `— الكل ${ALL.length} • دفعوا ${c.paid} • لسه ${c.unpaid} • لسه ما اتحددش ${c.none}`;
  const q = toLatin($('q').value).trim(), f = $('flt').value, nq = norm(q);
  const d = ALL.filter((s) => (!f || (s.fees_status || 'none') === f) && (!q || s.code.startsWith(q) || norm(s.name).includes(nq)));
  $('cnt').textContent = d.length + ' طالب';
  $('tb').innerHTML = d.map((s) => `<tr><td>${esc(s.code)}</td><td>${esc(s.name)}</td><td>${esc(grp(s.level))}</td><td>${esc(s.track)}</td><td><button class="btn sm ${s.fees_status === 'paid' ? '' : 'ghost'}" data-i="${s.id}" data-s="paid">دفع ✓</button> <button class="btn sm ${s.fees_status === 'unpaid' ? 'danger' : 'ghost'}" data-i="${s.id}" data-s="unpaid">لسه</button></td></tr>`).join('');
  $('tb').querySelectorAll('button').forEach((b) => b.onclick = async () => {
    const s = ALL.find((x) => x.id === +b.dataset.i); const st = s.fees_status === b.dataset.s ? null : b.dataset.s;
    const { error } = await sb.rpc('set_fee_one', { p_student: s.id, p_status: st }); if (error) return toast('حصل خطأ'); s.fees_status = st; draw();
  });
}
$('q').oninput = draw; $('flt').onchange = draw;
const PAID = /^(مدفوع|تم|سدد|سداد|دفع|paid|yes|نعم|1|✔|✓)/i;
function parseFile(wb) {
  const items = [];
  for (const name of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '' });
    let hi = rows.findIndex((r) => r.some((c) => /اسم|كود/.test(String(c))));
    let ci = -1, ni = -1, si = -1;
    if (hi >= 0) rows[hi].forEach((c, i) => { const t = String(c).replace(/\s/g, ''); if (/كود/.test(t) && ci < 0) ci = i; else if (/اسم|الاسم/.test(t) && ni < 0) ni = i; else if (/الحالة|السداد|الرسوم/.test(t) && si < 0) si = i; });
    if (ci < 0 && ni < 0) { hi = 0; ni = 1; }
    for (const r of rows.slice(hi + 1)) {
      const code = ci >= 0 ? toLatin(String(r[ci])).replace(/\D/g, '') : '', nm = ni >= 0 ? String(r[ni]).trim() : '';
      if (!code && !nm) continue;
      items.push({ sheet: name, code, name: nm, paid: si >= 0 ? PAID.test(String(r[si]).trim()) : true });
    }
  }
  return items;
}
$('up').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return; e.target.value = '';
  const items = parseFile(XLSX.read(await f.arrayBuffer(), { type: 'array' }));
  const byCode = new Map(ALL.map((s) => [s.code, s])), byName = new Map();
  ALL.forEach((s) => { const k = norm(s.name); byName.set(k, (byName.get(k) || []).concat(s)); });
  const hit = new Map(), miss = [], amb = [];
  for (const it of items) {
    let s = it.code ? byCode.get(it.code) : null;
    if (!s && it.name) { const m = byName.get(norm(it.name)); if (m && m.length === 1) s = m[0]; else if (m && m.length > 1) { amb.push(it); continue; } }
    if (!s) { miss.push(it); continue; }
    hit.set(s.id, { code: s.code, status: it.paid ? 'paid' : 'unpaid', name: s.name });
  }
  const paidN = [...hit.values()].filter((x) => x.status === 'paid').length;
  const m = $('modal'); m.classList.remove('hidden');
  m.innerHTML = `<div class="panel" style="max-width:520px;width:100%;max-height:90vh;overflow:auto"><h3>مراجعة الملف قبل الحفظ</h3>
    <p>اتقرا من الملف: <b>${items.length}</b> اسم</p>
    <p>✓ اتطابقوا مع طلاب النظام: <b>${hit.size}</b> (منهم دفعوا: <b>${paidN}</b>)</p>
    <p>${miss.length ? '⚠️' : '✓'} مش موجودين في طلابنا: <b>${miss.length}</b> <span class="muted">(غالبًا فرق تانية لسه ما اتضافتش)</span></p>
    ${amb.length ? `<p>⚠️ اسم متكرر بين أكتر من طالب: <b>${amb.length}</b></p>` : ''}
    <label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input type="checkbox" id="rest"> كل اللي مش في الملف يتحوّلوا لـ"لسه" (برتقالي)</label>
    <div class="row"><button class="btn" id="ok">حفظ</button><button class="btn ghost" id="xm">تنزيل اللي ما اتطابقوش</button><button class="btn ghost" id="no">إلغاء</button></div></div>`;
  $('no').onclick = () => m.classList.add('hidden');
  $('xm').onclick = () => exportXlsx(miss.concat(amb).map((x, i) => [i + 1, x.name, x.code, x.sheet]), ['#', 'الاسم', 'الكود', 'الورقة'], 'غير مطابق', 'غير-مطابقين.xlsx');
  $('ok').onclick = async () => {
    const list = [...hit.values()].map((x) => ({ code: x.code, status: x.status }));
    if ($('rest').checked) ALL.forEach((s) => { if (!hit.has(s.id)) list.push({ code: s.code, status: 'unpaid' }); });
    $('ok').disabled = true; let u = 0;
    for (let i = 0; i < list.length; i += 300) { const { data, error } = await sb.rpc('set_fees', { p_items: list.slice(i, i + 300) }); if (error) { toast('حصل خطأ: ' + error.message); $('ok').disabled = false; return; } u += data.updated; }
    m.classList.add('hidden'); toast('اتحدّث ' + u + ' طالب'); load();
  };
};
const ex = (pred, label, file) => exportXlsx(ALL.filter(pred).map((s, i) => [i + 1, s.code, s.name, grp(s.level), s.track, s.fees_status === 'paid' ? 'دفع' : (s.fees_status === 'unpaid' ? 'لسه' : 'غير محدد')]), ['#', 'الكود', 'الاسم', 'الفرقة', 'الشعبة', 'الرسوم'], label, file);
$('xUn').onclick = () => ex((s) => s.fees_status !== 'paid', 'لسه', 'لسه-ما-دفعوش.xlsx');
$('xPd').onclick = () => ex((s) => s.fees_status === 'paid', 'دفعوا', 'دفعوا-الرسوم.xlsx');
Auth.init({ roles: ['accounts', 'admin'], title: 'الحسابات — الرسوم', onReady: load });
</script>
</body></html>
